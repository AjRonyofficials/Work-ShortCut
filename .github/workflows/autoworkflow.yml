name: Auto Workflow - Build & Release APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: Auto Build & Release Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"
      GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.daemon=false"

    steps:
      - name: 1. Checkout Repository Source
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Set up Android SDK & Accept Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" 2>/dev/null || true
          printf "24333f8a63b1d79430c3179725083f6b753434da\n89388a2784103ab48e266614c0a88b772b988428\nd56f5187479451eabf01fb78af6dfcb131a6481e\ne67567a44c152738ca0c30263d723a3b1ca5f792" > "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          yes | sdkmanager --licenses 2>/dev/null || true
          echo "Android SDK licenses accepted."

      - name: 4. Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: false

      - name: 5. Prepare Environment & Configurations
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          touch .env

          # Ensure accessibility service xml exists
          mkdir -p app/src/main/res/xml
          if [ ! -f "app/src/main/res/xml/accessibility_service_config.xml" ]; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"' \
              '    android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"' \
              '    android:accessibilityFeedbackType="feedbackGeneric"' \
              '    android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagReportViewIds"' \
              '    android:canRetrieveWindowContent="true"' \
              '    android:canPerformGestures="true"' \
              '    android:description="@string/accessibility_service_description"' \
              '    android:notificationTimeout="50" />' > app/src/main/res/xml/accessibility_service_config.xml
          fi

      - name: 6. Setup Android Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          test -f debug.keystore
          echo "debug.keystore verified ($(wc -c < debug.keystore) bytes)"

      - name: 7. Prepare Gradle Executable
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 9.3.1 || true
            chmod +x gradlew 2>/dev/null || true
          fi

      - name: 8. Build Android Debug APK
        run: |
          export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true -Dfile.encoding=UTF-8 -Dsun.awt.noerasebackground=true"
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --no-daemon --no-parallel -Djava.awt.headless=true || gradle assembleDebug --no-daemon -Djava.awt.headless=true
          else
            gradle assembleDebug --no-daemon -Djava.awt.headless=true
          fi

      - name: 9. Collect and Verify Generated APK
        run: |
          mkdir -p release-apks
          APK_FOUND=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "ERROR: No APK found after build!"
            exit 1
          fi
          echo "Found APK: $APK_FOUND"
          cp "$APK_FOUND" release-apks/WorkShortCut-latest.apk
          cp "$APK_FOUND" "release-apks/WorkShortCut-v1.0.${{ github.run_number }}.apk"
          ls -lh release-apks/

      - name: 10. Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WorkShortCut-APK-Build-${{ github.run_number }}
          path: release-apks/*.apk
          retention-days: 30

      - name: 11. Auto Create GitHub Release with APK Download
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Work ShortCut Auto Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          files: release-apks/*.apk
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ### 🚀 Work ShortCut - Auto Workflow Release

            This APK was automatically generated and verified by **Auto Workflow**.

            - **App Name**: Work ShortCut
            - **Build Run**: `#${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`
            - **Trigger**: `${{ github.event_name }}`

            #### 📥 Download APK Directly:
            - **`WorkShortCut-latest.apk`** (Latest APK file ready for install)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
