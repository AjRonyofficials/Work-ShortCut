name: Build Work ShortCut APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"
      GRADLE_OPTS: "-Djava.awt.headless=true"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        continue-on-error: true

      - name: Prepare Environment Files
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          touch .env

      - name: Ensure Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding persistent debug.keystore from repository base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fresh debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f debug.keystore
          echo "debug.keystore is ready ($(wc -c < debug.keystore) bytes)"

      - name: Verify and Auto-Repair Critical Resource Configurations
        run: |
          mkdir -p app/src/main/res/xml
          if [ ! -f "app/src/main/res/xml/accessibility_service_config.xml" ]; then
            echo "Auto-repairing missing accessibility_service_config.xml..."
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"' \
              '    android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"' \
              '    android:accessibilityFeedbackType="feedbackGeneric"' \
              '    android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagReportViewIds"' \
              '    android:canRetrieveWindowContent="true"' \
              '    android:canPerformGestures="true"' \
              '    android:description="@string/accessibility_service_description"' \
              '    android:notificationTimeout="50" />' > app/src/main/res/xml/accessibility_service_config.xml
          fi
          test -f app/src/main/res/xml/accessibility_service_config.xml
          echo "accessibility_service_config.xml verified."

      - name: Ensure Gradle Wrapper and Executable Permissions
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "gradlew found and marked executable."
          fi
          # Test if wrapper works; if not, download Gradle 9.3.1 directly from GitHub releases mirror
          if [ ! -f "gradlew" ] || ! ./gradlew --version >/dev/null 2>&1; then
            echo "Gradle wrapper test failed or gradlew missing. Downloading Gradle 9.3.1 binary from GitHub releases CDN..."
            curl -sSL --retry 3 --retry-delay 2 "https://github.com/gradle/gradle-distributions/releases/download/v9.3.1/gradle-9.3.1-bin.zip" -o /tmp/gradle-9.3.1-bin.zip
            sudo unzip -q -o /tmp/gradle-9.3.1-bin.zip -d /opt/gradle
            sudo ln -sf /opt/gradle/gradle-9.3.1/bin/gradle /usr/local/bin/gradle
            gradle --version || true
          fi

      - name: Pre-populate Kotlin Compiler Artifacts from Maven Central
        run: |
          echo "Pre-populating Kotlin 2.2.10 compiler artifacts from Maven Central to bypass flaky GitHub releases mirrors..."
          CACHE_BASE="$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin"
          
          fetch_artifact() {
            local group_name="$1"
            local ver="$2"
            local sha="$3"
            local file="$4"
            local target_dir="$CACHE_BASE/$group_name/$ver/$sha"
            mkdir -p "$target_dir"
            if [ ! -f "$target_dir/$file" ] || [ ! -s "$target_dir/$file" ]; then
              echo "Fetching $file from Maven Central..."
              curl -sSL --retry 5 --retry-delay 2 "https://repo1.maven.org/maven2/org/jetbrains/kotlin/$group_name/$ver/$file" -o "$target_dir/$file"
            fi
            echo "Cached $file ($(wc -c < "$target_dir/$file") bytes)"
          }

          fetch_artifact "kotlin-compiler-embeddable" "2.2.10" "6882d39ef03b18879c1a5d2a83c2212361bed5fe" "kotlin-compiler-embeddable-2.2.10.jar"
          fetch_artifact "kotlin-compiler-embeddable" "2.2.10" "4e933584f8590460b4d080da5eb891ac0cb03679" "kotlin-compiler-embeddable-2.2.10.pom"
          fetch_artifact "kotlin-compose-compiler-plugin-embeddable" "2.2.10" "fd3cd12d4e9702cfcd731120564af86814cf95b7" "kotlin-compose-compiler-plugin-embeddable-2.2.10.jar"
          fetch_artifact "kotlin-compose-compiler-plugin-embeddable" "2.2.10" "9b1f452dd51d8a7274c799fa234d5d7b24ba22e5" "kotlin-compose-compiler-plugin-embeddable-2.2.10.pom"
          fetch_artifact "kotlin-daemon-embeddable" "2.2.10" "212fd3c2c6e4e5d0f4db3c4191233e2b622380cc" "kotlin-daemon-embeddable-2.2.10.jar"
          fetch_artifact "kotlin-daemon-embeddable" "2.2.10" "3487e8adfd32eccf389ce9077acaab7b168a1f86" "kotlin-daemon-embeddable-2.2.10.pom"
          fetch_artifact "kotlin-scripting-compiler-embeddable" "2.2.10" "25d0e9a886551d4a46ae85d4d5d0088829ef9" "kotlin-scripting-compiler-embeddable-2.2.10.jar"
          fetch_artifact "kotlin-scripting-compiler-embeddable" "2.2.10" "5b2289ae77495985523c987f4b5623102e0f8c7" "kotlin-scripting-compiler-embeddable-2.2.10.pom"
          fetch_artifact "kotlin-scripting-compiler-impl-embeddable" "2.2.10" "3f1bcab651be1ab86e8d240b797b1a05dd8b0027" "kotlin-scripting-compiler-impl-embeddable-2.2.10.jar"
          fetch_artifact "kotlin-scripting-compiler-impl-embeddable" "2.2.10" "4471dfcfdb09eea2767c0e67764df8a851d3299e" "kotlin-scripting-compiler-impl-embeddable-2.2.10.pom"

      - name: Build Debug APK
        run: |
          export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true -Dfile.encoding=UTF-8 -Dsun.awt.noerasebackground=true"
          if [ -f "./gradlew" ] && ./gradlew --version >/dev/null 2>&1; then
            echo "Building with ./gradlew (Gradle 9.3.1)..."
            ./gradlew assembleDebug --no-daemon --no-configuration-cache --no-parallel -Djava.awt.headless=true -Dksp.incremental=false
          elif command -v gradle >/dev/null 2>&1; then
            echo "Building directly with gradle CLI..."
            gradle assembleDebug --no-daemon --no-configuration-cache --no-parallel -Djava.awt.headless=true -Dksp.incremental=false
          else
            echo "Neither gradlew nor gradle CLI found, downloading Gradle 9.3.1 binary from GitHub..."
            curl -sSL --retry 3 "https://github.com/gradle/gradle-distributions/releases/download/v9.3.1/gradle-9.3.1-bin.zip" -o /tmp/gradle.zip
            sudo unzip -q -o /tmp/gradle.zip -d /opt/gradle
            /opt/gradle/gradle-9.3.1/bin/gradle assembleDebug --no-daemon --no-configuration-cache --no-parallel -Djava.awt.headless=true -Dksp.incremental=false
          fi

      - name: Verify Generated APK
        run: |
          ls -la app/build/outputs/apk/debug/
          find app/build/outputs/apk/ -name "*.apk"

      - name: Prepare APK Release Assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/WorkShortCut-latest.apk
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/WorkShortCut-v1.0.${{ github.run_number }}.apk"
          echo "Release assets prepared:"
          ls -la release-assets/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkShortCut-Debug-APK
          path: release-assets/*.apk
          retention-days: 30

      - name: Auto Deploy GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Work ShortCut ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          files: release-assets/*.apk
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🚀 Work ShortCut - Automated Deployment Build

            This release was automatically built, signed, and deployed by GitHub Actions.

            - **Application**: Work ShortCut
            - **Build Number**: `${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`
            - **Triggered By**: `${{ github.event_name }}` (${{ github.actor }})

            ### 📥 Direct APK Downloads:
            - **`WorkShortCut-latest.apk`**: Always contains the latest build.
            - **`WorkShortCut-v1.0.${{ github.run_number }}.apk`**: Version-tagged build for archiving.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
