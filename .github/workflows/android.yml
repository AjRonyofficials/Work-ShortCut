name: Android CI Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"
      GRADLE_OPTS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: false
          cache-read-only: false

      - name: Configure Environment
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          touch .env

      - name: Prepare Android Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          test -f debug.keystore
          echo "debug.keystore is verified."

      - name: Ensure Accessibility Service XML Config
        run: |
          mkdir -p app/src/main/res/xml
          if [ ! -f "app/src/main/res/xml/accessibility_service_config.xml" ]; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"' \
              '    android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"' \
              '    android:accessibilityFeedbackType="feedbackGeneric"' \
              '    android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagReportViewIds"' \
              '    android:canRetrieveWindowContent="true"' \
              '    android:canPerformGestures="true"' \
              '    android:description="@string/accessibility_service_description"' \
              '    android:notificationTimeout="50" />' > app/src/main/res/xml/accessibility_service_config.xml
          fi

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 9.3.1 || true
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Android APK (assembleDebug)
        run: |
          export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true -Dfile.encoding=UTF-8 -Dsun.awt.noerasebackground=true"
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --no-daemon --build-cache --parallel -Djava.awt.headless=true || gradle assembleDebug --no-daemon --build-cache --parallel -Djava.awt.headless=true
          else
            gradle assembleDebug --no-daemon --build-cache --parallel -Djava.awt.headless=true
          fi

      - name: Prepare Downloadable APK
        run: |
          mkdir -p build-artifacts
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          cp "$APK_FILE" build-artifacts/WorkShortCut-latest-debug.apk
          cp "$APK_FILE" "build-artifacts/WorkShortCut-v1.0.${{ github.run_number }}.apk"
          echo "Ready APK artifacts:"
          ls -la build-artifacts/

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkShortCut-Latest-APK
          path: build-artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ format('v1.0.{0}', github.run_number) }}
          name: Work ShortCut v1.0.${{ github.run_number }}
          files: build-artifacts/*.apk
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ### 📱 Work ShortCut Latest APK Build
            
            - **Commit**: `${{ github.sha }}`
            - **Build**: `#${{ github.run_number }}`
            
            #### 📥 Download:
            Download **`WorkShortCut-latest-debug.apk`** from below to install the update on your device.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
